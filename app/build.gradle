plugins {
  id 'com.android.application'
}

android {
  namespace 'org.perchance.artimoshka'
  compileSdk 34

  defaultConfig {
    applicationId 'org.perchance.artimoshka'
    minSdk 26
    targetSdk 34
    versionCode 2
    versionName '1.1'
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation 'androidx.core:core:1.13.1'
}
