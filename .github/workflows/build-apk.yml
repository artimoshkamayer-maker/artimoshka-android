name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          ls "$SDK/cmdline-tools"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Download LaMa model + ONNX engine into assets
        run: |
          mkdir -p app/src/main/assets/model app/src/main/assets/ort
          curl -sL https://huggingface.co/g-ronimo/lama/resolve/main/lama_512_int8.onnx -o app/src/main/assets/model/lama_512_int8.onnx
          ORT=https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist
          curl -sL $ORT/ort.webgpu.min.mjs -o app/src/main/assets/ort/ort.webgpu.min.mjs
          curl -sL $ORT/ort-wasm-simd-threaded.asyncify.mjs -o app/src/main/assets/ort/ort-wasm-simd-threaded.asyncify.mjs
          curl -sL $ORT/ort-wasm-simd-threaded.asyncify.wasm -o app/src/main/assets/ort/ort-wasm-simd-threaded.asyncify.wasm
          ls -la app/src/main/assets/model app/src/main/assets/ort

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Artimoshka-Ai.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Artimoshka-Ai-apk
          path: Artimoshka-Ai.apk
